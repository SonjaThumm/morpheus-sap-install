---
# Ansible sanity tests using only GitHub-native actions (no third-party dependencies).
# Use this workflow if enterprise policy blocks transitive action dependencies
# from ansible-community/ansible-test-gh-action.
#
# Always check ansible-core support matrix before configuring units matrix.
# https://docs.ansible.com/ansible/latest/reference_appendices/release_and_maintenance.html#ansible-core-support-matrix

name: Ansible Test - Sanity (Native)

permissions:
  contents: read

on:
  schedule:
    # This is 01:05 UTC, which is 3:05 AM in Prague/CEST
    - cron: '5 3 * * 1'

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

jobs:
  sanity-supported:
    runs-on: ubuntu-latest
    name: Sanity (Supported Ⓐ${{ matrix.ansible }}+py${{ matrix.python }})
    strategy:
      fail-fast: false  # Disabled so we can see all failed combinations.
      # Define a build matrix to test compatibility across multiple Ansible versions.
      # Each version listed below will spawn a separate job that runs in parallel.
      matrix:
        include:
          # Supported versions (must pass)
          - ansible: 'stable-2.18'  # Python 3.11 - 3.13
            python: '3.11'
            ansible_version: '2.18.*'
          - ansible: 'stable-2.18'
            python: '3.12'
            ansible_version: '2.18.*'
          - ansible: 'stable-2.19'  # Python 3.11 - 3.13
            python: '3.11'
            ansible_version: '2.19.*'
          - ansible: 'stable-2.19'
            python: '3.12'
            ansible_version: '2.19.*'
          - ansible: 'devel'  # Test against the upcoming development version.
            python: '3.13'
            ansible_version: 'devel'
    steps:
      - uses: actions/checkout@v5
        with:
          path: ansible_collections/community/sap_install

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core (${{ matrix.ansible }})
        run: |
          if [ "${{ matrix.ansible_version }}" = "devel" ]; then
            pip install https://github.com/ansible/ansible/archive/devel.tar.gz
          else
            pip install "ansible-core==${{ matrix.ansible_version }}"
          fi

      - name: Display versions
        run: |
          python --version
          ansible --version

      - name: Run ansible-test sanity
        working-directory: ansible_collections/community/sap_install
        run: |
          ansible-test sanity --local --python ${{ matrix.python }} -v --color

  sanity-eol:
    runs-on: ubuntu-latest
    # This job only runs if the supported tests pass
    needs: sanity-supported
    name: Sanity (EOL Ⓐ${{ matrix.ansible }}+py${{ matrix.python }})
    continue-on-error: true  # This entire job is allowed to fail
    strategy:
      fail-fast: false  # Disabled so we can see all failed combinations.
      # Define a build matrix to test compatibility across multiple Ansible versions.
      # Each version listed below will spawn a separate job that runs in parallel.
      matrix:
        include:
          # stable-2.14: Python 3.9 - 3.11
          - ansible: 'stable-2.14'
            python: '3.9'
            ansible_version: '2.14.*'
          - ansible: 'stable-2.14'
            python: '3.10'
            ansible_version: '2.14.*'
          - ansible: 'stable-2.14'
            python: '3.11'
            ansible_version: '2.14.*'
          # stable-2.15: Python 3.9 - 3.11
          - ansible: 'stable-2.15'
            python: '3.9'
            ansible_version: '2.15.*'
          - ansible: 'stable-2.15'
            python: '3.10'
            ansible_version: '2.15.*'
          - ansible: 'stable-2.15'
            python: '3.11'
            ansible_version: '2.15.*'
          # stable-2.16: Python 3.10 - 3.12
          - ansible: 'stable-2.16'
            python: '3.10'
            ansible_version: '2.16.*'
          - ansible: 'stable-2.16'
            python: '3.11'
            ansible_version: '2.16.*'
          - ansible: 'stable-2.16'
            python: '3.12'
            ansible_version: '2.16.*'
          # stable-2.17: Python 3.10 - 3.12
          - ansible: 'stable-2.17'
            python: '3.10'
            ansible_version: '2.17.*'
          - ansible: 'stable-2.17'
            python: '3.11'
            ansible_version: '2.17.*'
          - ansible: 'stable-2.17'
            python: '3.12'
            ansible_version: '2.17.*'
    steps:
      - uses: actions/checkout@v5
        with:
          path: ansible_collections/community/sap_install

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core (${{ matrix.ansible }})
        run: |
          pip install "ansible-core==${{ matrix.ansible_version }}"

      - name: Display versions
        run: |
          python --version
          ansible --version

      - name: Run ansible-test sanity
        working-directory: ansible_collections/community/sap_install
        run: |
          ansible-test sanity --local --python ${{ matrix.python }} -v --color
